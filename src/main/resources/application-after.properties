# after 프로파일: 개선한 구현.
#
# JDBC URL 이 프로파일에 있는 이유는, 배치 묶음 여부가 코드가 아니라 "연결 설정" 의 문제이기 때문이다.
# rewriteBatchedStatements=true 가 없으면 JdbcBatchItemWriter 가 addBatch/executeBatch 를 아무리 잘
# 써도 드라이버가 문장을 하나씩 보낸다. 즉 코드만 바꾸면 개선이 되지 않는 대표적인 항목이다.
#
# 1번 문제 after 는 이 값이 켜진 상태의 왕복 횟수를 before(행당 1.0회)와 비교하는 것이 목적이다.
spring.datasource.url=jdbc:mariadb://localhost:3307/batch_demo?rewriteBatchedStatements=true
